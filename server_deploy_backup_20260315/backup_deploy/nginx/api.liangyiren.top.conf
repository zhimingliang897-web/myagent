# api.liangyiren.top - 支持IP和域名访问

upstream ai-debate {
    server 127.0.0.1:5001;
}

upstream pdf-tools {
    server 127.0.0.1:5002;
}

upstream lines-service {
    server 127.0.0.1:5003;
}

upstream file-agent {
    server 127.0.0.1:5004;
}

upstream video-downloader {
    server 127.0.0.1:5005;
}

upstream integrity-tools {
    server 127.0.0.1:5006;
}

upstream myagent {
    server 127.0.0.1:7860;
}

# HTTP服务 - 同时支持IP和域名访问
server {
    listen 80;
    server_name api.liangyiren.top 8.138.164.133;
    client_max_body_size 100m;

    # ===== MyAgent 智能体 =====
    location /agent/ {
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://myagent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /agent {
        return 301 /agent/;
    }

    # ===== AI辩论赛 - 前端页面 =====
    location = /debate {
        rewrite ^ / break;
        proxy_pass http://ai-debate;
        proxy_set_header Host $host;
    }

    # ===== AI辩论赛 - API =====
    location /debate/api/ {
        rewrite ^/debate/api/(.*) /api/$1 break;
        proxy_pass http://ai-debate;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /debate/api/stream {
        rewrite ^/debate/api/stream /api/stream break;
        proxy_pass http://ai-debate;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /debate/audio/ {
        rewrite ^/debate/audio/(.*) /audio/$1 break;
        proxy_pass http://ai-debate;
        proxy_set_header Host $host;
    }

    # ===== PDF工具 =====
    location /pdf {
        rewrite ^/pdf$ / break;
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }

    location /pdf/ {
        rewrite ^/pdf/(.*) /$1 break;
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }

    # PDF工具API
    location /api/pdf_info {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/images_to_pdf {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/merge_pdfs {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/remove_pages {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/insert_pdf {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/reorder_pages {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/normalize_landscape {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /api/pdf_to_images {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }
    location /download/ {
        proxy_pass http://pdf-tools;
        proxy_set_header Host $host;
    }

    # ===== 其他独立服务 =====
    location /files/ {
        rewrite ^/files/(.*) /$1 break;
        proxy_pass http://file-agent;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /video/ {
        rewrite ^/video/(.*) /$1 break;
        proxy_pass http://video-downloader;
        proxy_set_header Host $host;
    }

    # ===== Integrity Tools API =====
    location /api/ {
        proxy_pass http://integrity-tools;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ===== 默认 - Integrity Tools前端 =====
    location / {
        proxy_pass http://integrity-tools;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
