# 端口8000 - 直接访问服务

upstream ai-debate-8000 {
    server 127.0.0.1:5001;
}

upstream pdf-tools-8000 {
    server 127.0.0.1:5002;
}

upstream integrity-tools-8000 {
    server 127.0.0.1:5006;
}

server {
    listen 8000;
    server_name _;
    client_max_body_size 100m;

    # AI辩论赛 - API
    location /debate/api/ {
        rewrite ^/debate/api/(.*) /api/$1 break;
        proxy_pass http://ai-debate-8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /debate/api/stream {
        rewrite ^/debate/api/(.*) /api/$1 break;
        proxy_pass http://ai-debate-8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /debate/audio/ {
        rewrite ^/debate/audio/(.*) /audio/$1 break;
        proxy_pass http://ai-debate-8000;
    }

    location /debate/ {
        rewrite ^/debate/(.*) /$1 break;
        proxy_pass http://ai-debate-8000;
    }

    # PDF API
    location /api/pdf_info {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/images_to_pdf {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/merge_pdfs {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/remove_pages {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/insert_pdf {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/reorder_pages {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/normalize_landscape {
        proxy_pass http://pdf-tools-8000;
    }
    location /api/pdf_to_images {
        proxy_pass http://pdf-tools-8000;
    }
    location /download/ {
        proxy_pass http://pdf-tools-8000;
    }

    # Integrity Tools API
    location /api/ {
        proxy_pass http://integrity-tools-8000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # 默认
    location / {
        proxy_pass http://integrity-tools-8000;
        proxy_set_header Host $host;
    }
}
